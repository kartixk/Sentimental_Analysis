<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sentiment Analysis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ededed;
            padding: 20px;
        }
        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            height: 130px;
            font-size: 16px;
            padding: 10px;
        }
        button {
            padding: 10px 25px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e3ffe3;
            border-left: 6px solid #4caf50;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Sentiment Analysis</h2>

    <form action="/predict" method="POST">
        <textarea name="review" placeholder="Enter your review here..."></textarea>
        <button type="submit">Predict</button>
    </form>

    {% if sentiment %}
        <div class="result">
            <h3>Prediction:</h3>
            <p><strong>Review:</strong> {{ review }}</p>
            <p><strong>Sentiment:</strong> {{ sentiment }}</p>
        </div>
    {% endif %}
</div>

</body>
</html>
